# Runs on every PR to main (as a required check) and on every push to main.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: this workflow only needs to read the repo.
permissions:
  contents: read

# A new push to the same PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same versions as the Brewfile installs locally, so CI and your Mac agree.
  YAMLLINT_VERSION: "1.38.0"
  KUBECONFORM_VERSION: "v0.8.0"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04-arm   # GitHub's free native arm64 runner for public repos
    timeout-minutes: 10
    steps:
      # Actions are pinned to full commit SHAs (tags can be moved); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install yamllint
        run: pip install "yamllint==${YAMLLINT_VERSION}"

      - name: Install kubeconform (checksum verified)
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          curl -fsSLO "$base/kubeconform-linux-arm64.tar.gz"
          curl -fsSLO "$base/CHECKSUMS"
          sha256sum --check --ignore-missing CHECKSUMS
          tar -xzf kubeconform-linux-arm64.tar.gz kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Lint
        run: make lint
